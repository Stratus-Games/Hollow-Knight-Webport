
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="https://cdn.jsdelivr.net/gh/Stratus-Games/Hollow-Knight-Webport@main/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight</title>

<link rel="icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(ellipse at 50% 100%,
        rgba(100,0,0,.24), transparent 65%),
        #000;
    transition: opacity .5s;
}

#loadingScreen::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0,0,0,.8) 100%
    );
}

.loader-content {
    position: relative;
    width: min(480px, 85%);
    text-align: center;
}

#status {
    font-size: 14px;
    color: #ddd;
    margin-bottom: 12px;
}

#overallBar {
    height: 5px;
    width: 100%;
    background: #222;
    overflow: hidden;
    border-radius: 5px;
}

#overallProgress {
    width: 0%;
    height: 100%;
    background: #bd1717;
    box-shadow: 0 0 15px #b00000;
    transition: width .2s ease;
}

.progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888;
    margin-top: 24px;
    margin-bottom: 8px;
}

.small-bar {
    width: 100%;
    height: 3px;
    background: #191919;
    border-radius: 3px;
    overflow: hidden;
}

.small-progress {
    height: 100%;
    width: 0%;
    background: #a51616;
    transition: width .15s;
}

#percentage {
    margin-top: 18px;
    font-size: 13px;
    color: #aaa;
    letter-spacing: 2px;
}

#details {
    margin-top: 24px;
    color: #555;
    font-size: 11px;
    line-height: 1.8;
}

#loadingError {
    display: none;
    margin-top: 25px;
    color: #ff5555;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 150px;
    overflow-y: auto;
}

#retryButton {
    display: none;
    margin-top: 20px;
    border: 1px solid #941818;
    background: #210707;
    color: white;
    padding: 12px 28px;
    cursor: pointer;
    letter-spacing: 2px;
}

#retryButton:hover {
    background: #481010;
}

#unity-container {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
}

#unity-canvas {
    width: min(100vw, 160vh);
    height: min(62.5vw, 100vh);
    max-width: 100%;
    max-height: calc(100% - 45px);
    aspect-ratio: 16 / 10;
    background: #000;
}

#unity-footer {
    width: min(960px, 100%);
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    color: #777;
    font-size: 12px;
}

#fullscreenButton {
    background: #171717;
    border: 1px solid #333;
    color: white;
    padding: 7px 15px;
    cursor: pointer;
}

#fullscreenButton:hover {
    background: #333;
}

@media(max-width: 600px) {
    #unity-canvas {
        width: 100vw;
        height: auto;
        max-height: calc(100vh - 38px);
    }
}
</style>
</head>

<body>

<div id="loadingScreen">
    <div class="loader-content">

        <div id="status">Preparing game...</div>

        <div id="overallBar">
            <div id="overallProgress"></div>
        </div>

        <div id="percentage">0%</div>

        <div class="progress-row">
            <span>GAME DATA</span>
            <span id="dataCount">0 / 44</span>
        </div>

        <div class="small-bar">
            <div class="small-progress" id="dataProgress"></div>
        </div>

        <div class="progress-row">
            <span>WEBASSEMBLY</span>
            <span id="wasmCount">0 / 3</span>
        </div>

        <div class="small-bar">
            <div class="small-progress" id="wasmProgress"></div>
        </div>

        <div id="details">
            Initializing storage...
        </div>

        <div id="loadingError"></div>

        <button id="retryButton" onclick="location.reload()">
            RETRY
        </button>

    </div>
</div>

<div id="unity-container">

    <canvas
        id="unity-canvas"
        width="960"
        height="600"
        tabindex="-1">
    </canvas>

    <div id="unity-footer">
        <span>Hollow Knight</span>
        <button id="fullscreenButton">FULLSCREEN</button>
    </div>

</div>

<script>
"use strict";

/* =====================================
   CONFIGURATION
===================================== */

const CONFIG = {

    buildURL: "Build/",

    loader: "hk.loader.js",

    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",

    dataParts: 44,
    wasmParts: 3,

    framework: "hk.framework.js",

    streamingAssets: "StreamingAssets",

    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",

    cacheVersion: "hk-stream-v3",

    storageDirectory: "HollowKnightCache"
};


/* =====================================
   ELEMENTS
===================================== */

const $ = id => document.getElementById(id);

const loadingScreen = $("loadingScreen");
const unityContainer = $("unity-container");
const canvas = $("unity-canvas");

const statusText = $("status");
const details = $("details");

const overallProgress = $("overallProgress");
const percentage = $("percentage");

const dataProgress = $("dataProgress");
const wasmProgress = $("wasmProgress");

const dataCount = $("dataCount");
const wasmCount = $("wasmCount");

const errorElement = $("loadingError");
const retryButton = $("retryButton");


/* =====================================
   PROGRESS
===================================== */

let completedData = 0;
let completedWasm = 0;

function setOverall(value) {

    value = Math.max(0, Math.min(100, value));

    overallProgress.style.width = value + "%";

    percentage.textContent =
        Math.floor(value) + "%";
}

function updateProgress() {

    dataProgress.style.width =
        completedData / CONFIG.dataParts * 100 + "%";

    wasmProgress.style.width =
        completedWasm / CONFIG.wasmParts * 100 + "%";

    dataCount.textContent =
        completedData + " / " + CONFIG.dataParts;

    wasmCount.textContent =
        completedWasm + " / " + CONFIG.wasmParts;

    const total =
        CONFIG.dataParts + CONFIG.wasmParts;

    const completed =
        completedData + completedWasm;

    // First 70% is file preparation.
    setOverall(completed / total * 70);
}


/* =====================================
   STORAGE
===================================== */

async function initializeStorage() {

    if (
        !navigator.storage ||
        !navigator.storage.getDirectory
    ) {
        throw new Error(
            "OPFS is unavailable. Open this page in a supported browser using HTTPS."
        );
    }

    if (navigator.storage.persist) {

        try {
            const persistent =
                await navigator.storage.persist();

            console.log(
                "Persistent storage:",
                persistent
            );

        } catch (e) {
            console.warn(e);
        }
    }

    const root =
        await navigator.storage.getDirectory();

    return await root.getDirectoryHandle(
        CONFIG.storageDirectory,
        { create: true }
    );
}


/* =====================================
   CACHE VALIDATION
===================================== */

async function getCachedFile(root, filename) {

    try {

        const fileHandle =
            await root.getFileHandle(filename);

        const markerHandle =
            await root.getFileHandle(
                filename + ".complete"
            );

        const file =
            await fileHandle.getFile();

        const marker =
            await markerHandle.getFile();

        const markerText =
            await marker.text();

        if (
            file.size > 0 &&
            markerText ===
                CONFIG.cacheVersion + ":" + file.size
        ) {

            console.log(
                "Valid cached file:",
                filename,
                file.size
            );

            return file;
        }

    } catch (e) {
        console.log(
            "Cache unavailable:",
            filename
        );
    }

    return null;
}


/* =====================================
   CACHE MARKER
===================================== */

async function markFileComplete(
    root,
    filename,
    fileSize
) {

    const handle =
        await root.getFileHandle(
            filename + ".complete",
            { create: true }
        );

    const writer =
        await handle.createWritable();

    try {

        await writer.write(
            CONFIG.cacheVersion + ":" + fileSize
        );

        await writer.close();

    } catch (error) {

        try {
            await writer.abort();
        } catch {}

        throw error;
    }
}


/* =====================================
   STREAMING MERGER
===================================== */

async function mergeFile(
    root,
    prefix,
    partCount,
    progressCallback
) {

    // Check completed cache.
    const cached =
        await getCachedFile(root, prefix);

    if (cached) {

        progressCallback(partCount);

        return cached;
    }

    // Remove previous completion marker.
    try {
        await root.removeEntry(
            prefix + ".complete"
        );
    } catch {}

    const outputHandle =
        await root.getFileHandle(
            prefix,
            { create: true }
        );

    const writer =
        await outputHandle.createWritable({
            keepExistingData: false
        });

    let totalBytes = 0;
    let completedParts = 0;

    try {

        for (let i = 0; i < partCount; i++) {

            const partName =
                prefix + "." +
                String(i).padStart(3, "0");

            const url =
                CONFIG.buildURL + partName;

            statusText.textContent =
                "Downloading " + partName;

            details.textContent =
                "Part " + (i + 1) +
                " of " + partCount +
                " — Streaming to storage";

            console.log("Fetching:", url);

            const response =
                await fetch(url, {
                    cache: "no-store"
                });

            if (!response.ok) {

                throw new Error(
                    "Download failed: " +
                    partName +
                    "\nHTTP " + response.status
                );
            }

            if (!response.body) {

                throw new Error(
                    "Streaming unavailable: " + partName
                );
            }

            const reader =
                response.body.getReader();

            let partBytes = 0;

            try {

                while (true) {

                    const result =
                        await reader.read();

                    if (result.done) break;

                    const chunk = result.value;

                    // Sequentially write each chunk.
                    // Do not accumulate chunks in RAM.
                    await writer.write(chunk);

                    const size = chunk.byteLength;

                    totalBytes += size;
                    partBytes += size;
                }

            } finally {

                reader.releaseLock();
            }

            if (partBytes === 0) {

                throw new Error(
                    "Downloaded part is empty: " + partName
                );
            }

            completedParts++;

            progressCallback(completedParts);

            console.log(
                "Finished:",
                partName,
                partBytes,
                "bytes"
            );

            // Allow UI rendering.
            await new Promise(resolve =>
                requestAnimationFrame(resolve)
            );
        }

        // Commit the completed output.
        await writer.close();

        const mergedFile =
            await outputHandle.getFile();

        if (
            mergedFile.size !== totalBytes ||
            mergedFile.size === 0
        ) {

            throw new Error(
                "Merged file size validation failed: " +
                prefix
            );
        }

        // Only completed files get a cache marker.
        await markFileComplete(
            root,
            prefix,
            mergedFile.size
        );

        console.log(
            "Merge complete:",
            prefix,
            mergedFile.size,
            "bytes"
        );

        return mergedFile;

    } catch (error) {

        try {
            await writer.abort();
        } catch {}

        // Remove corrupted output.
        try {
            await root.removeEntry(prefix);
        } catch {}

        try {
            await root.removeEntry(
                prefix + ".complete"
            );
        } catch {}

        throw error;
    }
}


/* =====================================
   PREPARE GAME FILES
===================================== */

async function prepareGameFiles() {

    statusText.textContent =
        "Initializing storage...";

    details.textContent =
        "Checking browser storage.";

    const root =
        await initializeStorage();

    if (navigator.storage.estimate) {

        const estimate =
            await navigator.storage.estimate();

        console.log(
            "Storage estimate:",
            estimate
        );

        if (
            estimate.quota != null &&
            estimate.usage != null
        ) {

            const available =
                estimate.quota - estimate.usage;

            console.log(
                "Available storage:",
                available
            );
        }
    }

    /* GAME DATA */

    statusText.textContent =
        "Preparing game data...";

    const dataFile =
        await mergeFile(
            root,
            CONFIG.dataPrefix,
            CONFIG.dataParts,

            completed => {

                completedData = completed;

                updateProgress();
            }
        );

    /* WEBASSEMBLY */

    statusText.textContent =
        "Preparing WebAssembly...";

    const wasmFile =
        await mergeFile(
            root,
            CONFIG.wasmPrefix,
            CONFIG.wasmParts,

            completed => {

                completedWasm = completed;

                updateProgress();
            }
        );

    return {
        dataFile,
        wasmFile
    };
}


/* =====================================
   UNITY LOADER
===================================== */

async function loadUnityLoader() {

    if (typeof createUnityInstance === "function") {
        return;
    }

    statusText.textContent =
        "Loading Unity engine...";

    const script =
        document.createElement("script");

    script.src =
        CONFIG.buildURL + CONFIG.loader;

    script.async = true;

    await new Promise((resolve, reject) => {

        script.onload = resolve;

        script.onerror = () => {

            reject(
                new Error(
                    "Could not load Unity loader:\n" +
                    script.src
                )
            );
        };

        document.head.appendChild(script);
    });

    if (typeof createUnityInstance !== "function") {

        throw new Error(
            "Unity loader loaded but createUnityInstance is missing."
        );
    }
}


/* =====================================
   START GAME
===================================== */

async function startGame() {

    try {

        errorElement.style.display = "none";
        retryButton.style.display = "none";

        completedData = 0;
        completedWasm = 0;

        updateProgress();

        statusText.textContent =
            "Preparing Hollow Knight...";

        const files =
            await prepareGameFiles();

        statusText.textContent =
            "Loading Unity engine...";

        details.textContent =
            "Preparing WebAssembly and game data.";

        setOverall(70);

        // Create URLs without reading the complete
        // files into JavaScript ArrayBuffers.

        const dataURL =
            URL.createObjectURL(files.dataFile);

        const wasmBlob =
            new Blob(
                [files.wasmFile],
                { type: "application/wasm" }
            );

        const wasmURL =
            URL.createObjectURL(wasmBlob);

        // Keep these URLs alive while Unity runs.
        window.hollowKnightBlobURLs = [
            dataURL,
            wasmURL
        ];

        const buildURL =
            new URL(
                CONFIG.buildURL,
                document.baseURI
            ).href;

        const config = {

            dataUrl: dataURL,

            frameworkUrl:
                buildURL + CONFIG.framework,

            codeUrl: wasmURL,

            streamingAssetsUrl:
                new URL(
                    CONFIG.streamingAssets,
                    document.baseURI
                ).href,

            companyName:
                CONFIG.companyName,

            productName:
                CONFIG.productName,

            productVersion:
                CONFIG.productVersion
        };

        // Load the Unity loader with error handling.
        await loadUnityLoader();

        statusText.textContent =
            "Starting Hollow Knight...";

        details.textContent =
            "Initializing the game engine.";

        unityContainer.style.display = "flex";

        canvas.style.visibility = "hidden";

        const unityInstance =
            await createUnityInstance(
                canvas,
                config,

                progress => {

                    const value =
                        70 + progress * 30;

                    setOverall(value);

                    statusText.textContent =
                        "Loading Hollow Knight...";

                    details.textContent =
                        "Initializing game engine.";
                }
            );

        window.unityInstance =
            unityInstance;

        canvas.style.visibility = "visible";

        setOverall(100);

        statusText.textContent =
            "Hollow Knight ready";

        details.textContent =
            "Enjoy your game.";

        // Hide loading screen.
        loadingScreen.style.opacity = "0";

        setTimeout(() => {

            loadingScreen.style.display = "none";

        }, 500);

        // Fullscreen button.
        $("fullscreenButton").onclick = () => {

            unityInstance.SetFullscreen(1);
        };

        console.log(
            "Hollow Knight started successfully."
        );

    } catch (error) {

        console.error(
            "Hollow Knight loading error:",
            error
        );

        unityContainer.style.display = "none";

        statusText.textContent =
            "Unable to load Hollow Knight";

        errorElement.style.display = "block";

        errorElement.textContent =
            error.stack || error.message || String(error);

        retryButton.style.display =
            "inline-block";

        details.textContent =
            "An error occurred. Check the error message above.";
    }
}


/* =====================================
   INITIALIZE
===================================== */

window.addEventListener("load", () => {

    startGame();

});

</script>

</body>
</html>
